<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10111a">
  <title>ClipForge AI</title>
</head>
<body>
  <header>
    <div class="logo">✂ Clip<span>Forge</span></div>
    <div class="subtitle">Your personal video clipping studio</div>
  </header>

  <main>
    <section class="panel">
      <h2>01 / Upload your video</h2>
      <input type="file" id="upload" accept="video/*">
      <video id="video" controls playsinline hidden></video>
      <p class="small" id="videoInfo">No video selected yet.</p>
    </section>

    <section class="panel">
      <h2>02 / Video transcript</h2>
      <textarea id="transcript" placeholder="Paste your video transcript here..."></textarea>
      <p class="small">Use this to identify interesting moments.</p>
    </section>

    <section class="panel">
      <h2>03 / Create a clip</h2>
      <div class="times">
        <div>
          <label for="start">Start time (seconds)</label>
          <input type="number" id="start" min="0" step="0.1" value="0">
        </div>
        <div>
          <label for="end">End time (seconds)</label>
          <input type="number" id="end" min="0.1" step="0.1" value="30">
        </div>
      </div>
      <button class="secondary" id="setStart">Use current video time as start</button>
      <button class="secondary" id="setEnd">Use current video time as end</button>
      <button id="addClip">+ Add clip to my list</button>
      <p id="status" role="status" aria-live="polite">Ready when you are.</p>
    </section>

    <section class="panel">
      <h2>04 / Your clips</h2>
      <div id="clips"><p class="small">Your selected clips will appear here.</p></div>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
